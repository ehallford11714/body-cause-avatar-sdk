[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodycause"
version = "0.1.0"
description = "BodyCause Avatar SDK — causal limb+face from intent/KPI streams for games and avatars"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ephraim Hallford" }]
keywords = ["avatar", "animation", "causal", "motion", "sdk", "unity", "skeleton"]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
render = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["bodycause[render,dev]"]

[project.scripts]
bodycause = "bodycause.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
